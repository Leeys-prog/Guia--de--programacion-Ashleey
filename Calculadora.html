<!DOCTYPE html>
<html>
<head>
    <style>
body {
    font-family: Arial;
    background: #e8eaf6;
    text-align: center;
    padding-top: 50px;
}

.calculadora {
    background: white;
    width: 350px;
    margin: auto;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 15px #aaa;
}

input {
    width: 120px;
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: 1px solid #aaa;
}

button {
    padding: 10px 14px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #5c6bc0;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3949ab;
}

#resultado {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
}
</style>
    <title>Calculadora</title>
</head>
<body>

    <h2>Calculadora </h2>

    <input type="number" id="numero1" placeholder="Primer numero">
    <input type="number" id="numero2" placeholder="Segundo numero">

    <br><br>

    <button onclick="calcular('suma')">Suma</button>
    <button onclick="calcular('resta')">Resta</button>
    <button onclick="calcular('multiplicacion')">Multiplicacion</button>
    <button onclick="calcular('division')">Division</button>

    <p id="resultado"></p>

    <script>
        function calcular(operacion) {

            let numero1 = Number(document.getElementById("numero1").value);
            let numero2 = Number(document.getElementById("numero2").value);
            let resultado = 0;

            switch (operacion) {

                case "suma":
                    resultado = numero1 + numero2;
                    break;

                case "resta":
                    resultado = numero1 - numero2;
                    break;

                case "multiplicacion":
                    resultado = numero1 * numero2;
                    break;

                case "division":
                    resultado = numero1 / numero2;
                    break;
            }

            document.getElementById("resultado").innerHTML =
                "Resultado: " + resultado;
        }
    </script>

</body>
</html>
